/* =====================================================================
   MINI GAME 2 — FISH BEAT FLOW
   Salmon leave the pump pipe and slide down a steel grate toward four
   gates at the treatment tank. Notes are generated on the music grid,
   so every catch lands on the beat and plays a note of the chord.
   ===================================================================== */
const BEAT = {
  LANES: 4, LEAD_STEPS: 32, BARS_PER_LEVEL: 8,      // 2-bar count-in, speed-up every 8 bars
  BPM0: 96, BPM_STEP: 8, BPM_MAX: 172,
  TRAVEL0: 1.9, TRAVEL_MIN: 0.8, TRAVEL_STEP: 0.11,  // seconds from pipe to gate
  PERFECT: 0.055, GOOD: 0.12, BAD: 0.17,             // timing windows (s)
  HP_MISS: 8, HP_GOOD: 1.5, HP_PERFECT: 3,
  PTS_PERFECT: 300, PTS_GOOD: 100, KG_PER_FISH: 4.6,
  MIN_LANE_GAP: 0.14,
  PERSP: 1.3,
  KEYS: { KeyD: 0, ArrowLeft: 0, Digit1: 0, KeyF: 1, ArrowDown: 1, Digit2: 1, KeyJ: 2, ArrowUp: 2, Digit3: 2, KeyK: 3, ArrowRight: 3, Digit4: 3 },
  LABELS: ['D', 'F', 'J', 'K'],
};

function makeBeatSong(game) {
  return {
    tempo: game.tempo,
    schedule(i, tt, d) {
      const { V } = Audio;
      const L = game.levelOf(i), s = i % 16, bar = Math.floor(i / 16), ch = PROG_A[bar % 4];
      const lead = i < BEAT.LEAD_STEPS;
      if (s % 4 === 0) V.kick(tt, lead ? 0.55 : 0.8);
      if (s % 4 === 2) V.hat(tt, 0.06);
      if (!lead && L >= 2 && s % 2 === 1) V.hat(tt, 0.022, 0.03);
      if (!lead && L >= 3 && (s === 4 || s === 12)) V.clap(tt, 0.16);
      if (!lead && (s === 0 || s === 3 || s === 6 || s === 8 || s === 11 || s === 14)) V.bass(tt, midi(ch.root + (s === 14 ? 12 : 0)), d * 2, 0.15);
      if (s === 0) V.pad(tt, ch.pad.map(midi), d * 16, lead ? 0.018 : 0.022);
      if (!lead && L >= 4 && s % 4 === 2) V.pluck(tt, midi(ch.pad[(s >> 2) % 3] + 24), 0.2, 0.022);
      if (i >= BEAT.LEAD_STEPS && (i - BEAT.LEAD_STEPS) % (16 * BEAT.BARS_PER_LEVEL) === 0) V.crash(tt, 0.07);
      if (i >= 16 && lead && s % 4 === 0) V.pluck(tt, midi(s === 12 ? 81 : 76), 0.15, 0.07); // count-in
    },
  };
}

class BeatGame {
  constructor(api, opts = {}) {
    this.api = api; this.thumb = !!opts.thumb;
    this.parts = new Particles(360);
    this.notes = []; this.pads = [0, 0, 0, 0]; this.padMiss = [0, 0, 0, 0];
    this.popups = []; this.rings = []; this.beatPulse = 0; this.combo = 0; this.comboPulse = 0; this.shake = 0;
    this.streaks = Array.from({ length: 30 }, (_, k) => ({ u: (k * 0.618 + 0.05) % 1, o: (k * 0.137) % 1, s: rand(0.45, 0.7) }));
  }
  levelOf(i) { return 1 + Math.floor(Math.max(0, i - BEAT.LEAD_STEPS) / (16 * BEAT.BARS_PER_LEVEL)); }
  bpmOfLevel(L) { return Math.min(BEAT.BPM_MAX, BEAT.BPM0 + (L - 1) * BEAT.BPM_STEP); }
  travelOf(L) { return Math.max(BEAT.TRAVEL_MIN, BEAT.TRAVEL0 - (L - 1) * BEAT.TRAVEL_STEP); }
  now() { return Audio.songTime(); }

  /* ---------- lifecycle ---------- */
  start() {
    this.rng = mulberry32((Math.random() * 1e9) | 0);
    this.tempo = new TempoMap((i) => this.bpmOfLevel(this.levelOf(i)));
    this.notes = []; this.genStep = 0; this.lastLane = 1; this.laneLast = [-9, -9, -9, -9]; this.lastNoteStep = -9; this.nid = 0;
    this.score = 0; this.combo = 0; this.maxCombo = 0; this.hp = 100; this.fishSorted = 0;
    this.counts = { perfect: 0, good: 0, miss: 0 };
    this.level = 1; this.curStep = 0; this.lastBeat = -1;
    this.pads = [0, 0, 0, 0]; this.padMiss = [0, 0, 0, 0]; this.popups = []; this.rings = [];
    this.shake = 0; this.ending = false; this.endT = 0; this.reported = false; this.parts.clear();
    Audio.playSong(makeBeatSong(this));
  }
  destroy() {}
  mult() { return 1 + Math.min(3, Math.floor(this.combo / 10) * 0.5); }

  hud() {
    const hp = this.hp / 100;
    return [
      { k: 'score', label: t('hud.score'), value: nf(this.score) },
      { k: 'combo', label: t('hud.combo'), value: this.combo + ' ×' + this.mult().toFixed(1) },
      { k: 'level', label: t('hud.bpm'), value: this.level + ' · ' + this.bpmOfLevel(this.level) + ' BPM' },
      { k: 'flow', label: t('hud.flow'), meter: hp, color: hp > 0.5 ? C.aqua : hp > 0.25 ? C.warn : C.danger },
    ];
  }
  result() {
    const c = this.counts, total = c.perfect + c.good + c.miss;
    const acc = total ? ((c.perfect + c.good * 0.6) / total) * 100 : 0;
    const kg = this.fishSorted * BEAT.KG_PER_FISH;
    return {
      score: this.score, reason: t('reason.beat'),
      lines: [
        [t('st.fish'), nf(this.fishSorted)],
        [t('st.biomass'), kg >= 1000 ? nf(kg / 1000, 2) + ' t' : nf(kg) + ' kg'],
        [t('st.maxCombo'), nf(this.maxCombo)],
        [t('st.level'), this.level + ' · ' + this.bpmOfLevel(this.level) + ' BPM'],
        [t('st.perfect') + ' / ' + t('st.good') + ' / ' + t('st.miss'), `${c.perfect} / ${c.good} / ${c.miss}`],
        [t('st.accuracy'), nf(acc, 1) + ' %'],
      ],
    };
  }

  /* ---------- input ---------- */
  onKeyDown(code) { const lane = BEAT.KEYS[code]; if (lane !== undefined) this.press(lane); }
  onPointerDown(x, y) {
    if (y < this.topY * 0.6) return;
    const lane = clamp(Math.floor((x - (this.cx - this.bottomW / 2)) / (this.bottomW / 4)), 0, 3);
    this.press(lane);
  }
  press(lane) {
    if (this.ending) return;
    const tNow = this.now();
    this.pads[lane] = 1;
    let best = null, bd = Infinity;
    for (const n of this.notes) {
      if (n.judged || n.lane !== lane) continue;
      const d = Math.abs(tNow - n.time);
      if (d < bd) { bd = d; best = n; }
    }
    if (!best || bd > BEAT.BAD) { Audio.sfx.empty(); return; }
    this.judge(best, bd <= BEAT.PERFECT ? 'perfect' : bd <= BEAT.GOOD ? 'good' : 'miss');
  }
  judge(n, res) {
    n.judged = true; n.res = res; n.jt = this.now();
    this.counts[res]++;
    const x = this.laneX(n.lane, 1), y = this.hitY;
    this.popups.push({ lane: n.lane, res, t: 0 });
    if (res === 'miss') {
      this.combo = 0;
      this.hp = Math.max(0, this.hp - (BEAT.HP_MISS + (this.level - 1) * 0.6));
      this.padMiss[n.lane] = 1; this.shake = REDUCED ? 0 : 6;
      Audio.sfx.miss();
      return;
    }
    this.combo++; this.maxCombo = Math.max(this.maxCombo, this.combo);
    this.score += Math.round((res === 'perfect' ? BEAT.PTS_PERFECT : BEAT.PTS_GOOD) * this.mult());
    this.hp = Math.min(100, this.hp + (res === 'perfect' ? BEAT.HP_PERFECT : BEAT.HP_GOOD));
    this.fishSorted++;
    if (this.combo % 25 === 0) this.comboPulse = 1;
    Audio.sfx.hit(midi(PROG_A[n.chord].hit[n.lane]), res === 'perfect');
    this.parts.burst(x, y, res === 'perfect' ? 22 : 12, 460, res === 'perfect' ? C.aqua2 : '#e0f7ff', { dir: -Math.PI / 2, spread: 2.4, grav: 1000 });
    this.rings.push({ x, y, t: 0, col: res === 'perfect' ? C.aqua2 : C.ice });
  }
  fail() {
    this.ending = true; this.endT = 0;
    Audio.stopSong(); Audio.sfx.gameOver();
  }

  /* ---------- chart generation (runs ahead of the song) ---------- */
  generate(tNow) {
    for (let guard = 0; guard < 256; guard++) {
      const i = this.genStep, L = this.levelOf(i), tt = this.tempo.time(i);
      if (tt - this.travelOf(L) > tNow + 0.5) break;
      this.genStepNotes(i, tt, L);
      this.genStep++;
    }
  }
  genStepNotes(i, tt, L) {
    if (i < BEAT.LEAD_STEPS) return;
    const r = this.rng, s = i % 16;
    const barInLevel = Math.floor((i - BEAT.LEAD_STEPS) / 16) % BEAT.BARS_PER_LEVEL;
    const firstBars = i < BEAT.LEAD_STEPS + 32;
    let p;
    if (s % 4 === 0) p = Math.min(0.95, 0.72 + 0.04 * L);          // on the beat
    else if (s % 2 === 0) p = firstBars ? 0.05 : Math.min(0.6, 0.1 + 0.08 * L); // off-beat 8ths
    else p = L >= 5 ? Math.min(0.22, 0.05 * (L - 4)) : 0;          // 16ths at high levels
    if (barInLevel === BEAT.BARS_PER_LEVEL - 1) p *= 0.4;          // breathing bar before speed-up
    if (s % 2 === 1 && this.lastNoteStep === i - 1) p = 0;
    if (r() >= p) return;
    const lane = this.pickLane(tt);
    const a = this.addNote(i, tt, L, lane, false);
    if (L >= 3 && s % 8 === 0 && r() < Math.min(0.35, 0.07 * L)) {
      const opts = [0, 1, 2, 3].filter((l) => l !== lane && tt - this.laneLast[l] >= BEAT.MIN_LANE_GAP);
      if (opts.length) { const b = this.addNote(i, tt, L, opts[Math.floor(r() * opts.length)], true); a.partner = b; b.partner = a; }
    }
  }
  pickLane(tt) {
    const r = this.rng;
    for (let k = 0; k < 8; k++) {
      const d = weighted([[1, 3], [-1, 3], [2, 1.5], [-2, 1.5], [0, 0.8], [3, 0.5], [-3, 0.5]], r());
      let l = this.lastLane + d;
      if (l < 0) l = -l; if (l > 3) l = 6 - l; l = clamp(l, 0, 3);
      if (tt - this.laneLast[l] >= BEAT.MIN_LANE_GAP) return l;
    }
    let best = 0; for (let l = 1; l < 4; l++) if (this.laneLast[l] < this.laneLast[best]) best = l;
    return best;
  }
  addNote(i, tt, L, lane, pair) {
    const n = { id: this.nid++, i, time: tt, lane, spawn: tt - this.travelOf(L), judged: false, res: null, jt: 0, chord: Math.floor(i / 16) % 4, wig: this.rng() * TAU, partner: null };
    this.notes.push(n);
    this.laneLast[lane] = tt; this.lastNoteStep = i;
    if (!pair) this.lastLane = lane;
    return n;
  }

  /* ---------- update ---------- */
  update(dt) {
    const tNow = this.now();
    this.parts.update(dt);
    for (let l = 0; l < 4; l++) { this.pads[l] = Math.max(0, this.pads[l] - dt * 6); this.padMiss[l] = Math.max(0, this.padMiss[l] - dt * 3); }
    this.shake = Math.max(0, this.shake - dt * 30);
    this.beatPulse = Math.max(0, this.beatPulse - dt * 4);
    this.comboPulse = Math.max(0, this.comboPulse - dt * 1.5);
    for (const p of this.popups) p.t += dt;
    for (const r of this.rings) r.t += dt;
    if (this.popups.length && this.popups[0].t > 0.7) this.popups = this.popups.filter((p) => p.t < 0.7);
    if (this.rings.length && this.rings[0].t > 0.5) this.rings = this.rings.filter((r) => r.t < 0.5);

    // spray from the pump mouth
    if (!this.thumb && Math.random() < dt * 40) {
      const a = rand(0.2, Math.PI - 0.2);
      this.parts.spawn(this.cx + rand(-1, 1) * this.topW * 0.35, this.topY, Math.cos(a) * rand(20, 90), Math.sin(a) * rand(40, 140), rand(0.4, 0.8), rand(1, 2.4), 'rgba(224,247,255,.7)', 200, 1);
    }

    if (this.ending) {
      this.endT += dt;
      if (this.endT > 1.6 && !this.reported) { this.reported = true; this.api.endGame(this.result()); }
      return;
    }
    this.generate(tNow);
    while (this.tempo.time(this.curStep + 1) <= tNow) this.curStep++;
    const beat = Math.floor(this.curStep / 4);
    if (tNow >= 0 && beat !== this.lastBeat) { this.lastBeat = beat; this.beatPulse = 1; }
    const L = this.levelOf(this.curStep);
    if (L > this.level) {
      this.level = L;
      this.api.banner(t('banner.levelup'), `${t('hud.level')} ${L} · ${this.bpmOfLevel(L)} BPM`);
    }
    let prune = false;
    for (const n of this.notes) {
      if (!n.judged && tNow - n.time > BEAT.BAD) this.judge(n, 'miss');
      if (n.judged && tNow - n.jt > 0.6) prune = true;
    }
    if (prune) this.notes = this.notes.filter((n) => !n.judged || tNow - n.jt <= 0.6);
    if (this.hp <= 0) this.fail();
  }

  /* ---------- geometry ---------- */
  resize(W, H) {
    this.W = W; this.H = H;
    const hudH = this.thumb ? 0 : 84;
    this.topY = this.thumb ? H * 0.12 : hudH + Math.max(26, H * 0.06);
    this.hitY = this.thumb ? H * 0.82 : H - Math.max(92, H * 0.16);
    this.bottomW = Math.min(W - 28, 780, (this.hitY - this.topY) * 1.25);
    this.topW = this.bottomW * 0.3;
    this.cx = W / 2;
    this.padH = clamp(H * 0.065, this.thumb ? 10 : 30, 58);
    this.buildBg();
  }
  persp(p) { return p <= 0 ? 0 : Math.pow(p, BEAT.PERSP); }
  yAt(p) { return this.topY + (this.hitY - this.topY) * this.persp(p); }
  wAt(p) { return this.topW + (this.bottomW - this.topW) * this.persp(p); }
  laneX(l, p) { return this.cx + ((l - 1.5) / 4) * this.wAt(p); }
  pAtY(y) { const r = (y - this.topY) / (this.hitY - this.topY); return r <= 0 ? 0 : Math.pow(r, 1 / BEAT.PERSP); }

  // Static layers (tank, grate, lanes, pump pipe) are pre-rendered once per resize.
  buildBg() {
    const { W, H, cx, topY: top, topW } = this;
    const dpr = this.thumb ? 1 : Math.min(window.devicePixelRatio || 1, CFG.DPR_CAP);
    const c = document.createElement('canvas'); c.width = Math.ceil(W * dpr); c.height = Math.ceil(H * dpr);
    const g = c.getContext('2d'); g.scale(dpr, dpr);
    const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#051820'); bg.addColorStop(1, '#0b2d39');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    // tank walls: stainless panels converging on the pipe
    const pEnd = this.pAtY(H + 10), bw = this.wAt(pEnd);
    g.strokeStyle = 'rgba(186,202,210,.05)'; g.lineWidth = 1;
    for (let k = -12; k <= 12; k++) { g.beginPath(); g.moveTo(cx + k * topW * 0.18, top); g.lineTo(cx + k * bw * 0.18, H + 10); g.stroke(); }
    // grate trapezoid
    const trap = () => { g.beginPath(); g.moveTo(cx - topW / 2, top); g.lineTo(cx + topW / 2, top); g.lineTo(cx + bw / 2, H + 10); g.lineTo(cx - bw / 2, H + 10); g.closePath(); };
    trap(); g.fillStyle = '#040b0e'; g.fill();
    const N = 44;
    const bar = g.createLinearGradient(0, top, 0, H);
    bar.addColorStop(0, '#0d1b21'); bar.addColorStop(0.55, '#18303a'); bar.addColorStop(0.85, '#1f3a45'); bar.addColorStop(1, '#162b33');
    g.fillStyle = bar;
    for (let k = 0; k < N; k++) {
      const u0 = (k + 0.3) / N - 0.5, u1 = (k + 0.7) / N - 0.5;
      g.beginPath(); g.moveTo(cx + u0 * topW, top); g.lineTo(cx + u1 * topW, top); g.lineTo(cx + u1 * bw, H + 10); g.lineTo(cx + u0 * bw, H + 10); g.closePath(); g.fill();
    }
    // lane tint + dividers
    g.save(); trap(); g.clip();
    g.fillStyle = 'rgba(21,87,116,.16)';
    for (const l of [1, 3]) {
      const a0 = (l / 4 - 0.5), a1 = ((l + 1) / 4 - 0.5);
      g.beginPath(); g.moveTo(cx + a0 * topW, top); g.lineTo(cx + a1 * topW, top); g.lineTo(cx + a1 * bw, H + 10); g.lineTo(cx + a0 * bw, H + 10); g.closePath(); g.fill();
    }
    const hz = g.createLinearGradient(0, top, 0, top + (this.hitY - top) * 0.5);
    hz.addColorStop(0, 'rgba(224,247,255,.12)'); hz.addColorStop(1, 'rgba(224,247,255,0)');
    g.fillStyle = hz; g.fillRect(0, top, W, H);
    g.restore();
    for (let l = 0; l <= 4; l++) {
      const u = l / 4 - 0.5;
      g.strokeStyle = l === 0 || l === 4 ? 'rgba(74,223,202,.55)' : 'rgba(74,223,202,.3)';
      g.lineWidth = l === 0 || l === 4 ? 3 : 1.5;
      g.beginPath(); g.moveTo(cx + u * topW, top); g.lineTo(cx + u * bw, H + 10); g.stroke();
    }
    // pump pipe coming down from above
    const pr = topW * 0.62;
    const pg = g.createLinearGradient(cx - pr, 0, cx + pr, 0);
    pg.addColorStop(0, '#1b2428'); pg.addColorStop(0.35, '#8c9ba0'); pg.addColorStop(0.6, '#56646a'); pg.addColorStop(1, '#141c1f');
    g.fillStyle = pg; g.fillRect(cx - pr, -10, pr * 2, top + 10);
    g.fillStyle = 'rgba(0,0,0,.35)';
    for (let y = top - pr * 0.9; y > -20; y -= pr * 0.9) g.fillRect(cx - pr, y, pr * 2, 3);
    g.fillStyle = '#6f7e84'; g.beginPath(); g.ellipse(cx, top, pr, pr * 0.3, 0, 0, TAU); g.fill();
    g.fillStyle = '#020607'; g.beginPath(); g.ellipse(cx, top, pr * 0.8, pr * 0.22, 0, 0, TAU); g.fill();
    this.bg = c;
  }

  /* ---------- rendering ---------- */
  render(g) {
    const tNow = this.now();
    const { W, H, cx, hitY, bottomW, padH } = this;
    g.save();
    if (this.shake > 0) g.translate(rand(-1, 1) * this.shake * 0.5, rand(-1, 1) * this.shake * 0.5);
    g.drawImage(this.bg, 0, 0, W, H);

    // water streaks flowing down the grate
    g.strokeStyle = 'rgba(224,247,255,.07)'; g.lineWidth = 1.5;
    g.beginPath();
    for (const s of this.streaks) {
      const p = ((s.o + tNow * s.s) % 1 + 1) % 1 * 1.15, p2 = p + 0.05;
      const u = s.u - 0.5;
      g.moveTo(this.cx + u * this.wAt(p), this.yAt(p)); g.lineTo(this.cx + u * this.wAt(p2), this.yAt(p2));
    }
    g.stroke();

    // gate line pulses on every beat
    const pulse = this.beatPulse;
    g.save();
    g.shadowColor = C.aqua2; g.shadowBlur = 10 + pulse * 14;
    g.strokeStyle = `rgba(74,223,202,${0.55 + pulse * 0.45})`; g.lineWidth = 3;
    g.beginPath(); g.moveTo(cx - bottomW / 2, hitY); g.lineTo(cx + bottomW / 2, hitY); g.stroke();
    g.restore();

    // gates (pads)
    const pw = bottomW / 4 - 10;
    for (let l = 0; l < 4; l++) {
      const x = this.laneX(l, 1) - pw / 2, y = hitY - padH / 2;
      roundRect(g, x, y, pw, padH, 8);
      g.fillStyle = 'rgba(34,135,179,.3)'; g.fill();
      if (this.pads[l] > 0) { g.fillStyle = `rgba(29,203,172,${0.75 * this.pads[l]})`; g.fill(); }
      g.lineWidth = 2; g.strokeStyle = this.padMiss[l] > 0 ? `rgba(255,68,68,${0.4 + this.padMiss[l] * 0.6})` : C.teal3; g.stroke();
      if (!IS_TOUCH && !this.thumb) {
        g.fillStyle = this.pads[l] > 0.3 ? C.deep : 'rgba(224,247,255,.85)';
        g.font = `700 ${Math.round(padH * 0.42)}px ${FONT_MONO}`; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(BEAT.LABELS[l], x + pw / 2, y + padH / 2 + 1);
      }
    }

    // fish (far ones first)
    const laneW = bottomW / 4;
    for (let k = this.notes.length - 1; k >= 0; k--) {
      const n = this.notes[k];
      let p = (tNow - n.spawn) / (n.time - n.spawn);
      if (p < 0) continue;
      let alpha = p < 0.07 ? p / 0.07 : 1, scale = 1;
      if (n.judged && n.res !== 'miss') {           // caught: dives through the gate
        const q = (tNow - n.jt) / 0.25; if (q > 1) continue;
        p = 1 + q * 0.08; alpha = 1 - q; scale = 1 - q * 0.45;
      } else if (p > 1) {
        alpha *= Math.max(0, 1 - (p - 1) / 0.35); if (alpha <= 0) continue;
      }
      const w = this.wAt(p);
      const x = this.laneX(n.lane, p) + Math.sin(tNow * 9 + n.wig) * w * 0.01, y = this.yAt(p);
      const L = laneW * 0.62 * (w / bottomW) * scale;
      const ang = Math.atan2(this.yAt(p + 0.02) - this.yAt(p), this.laneX(n.lane, p + 0.02) - this.laneX(n.lane, p)) + Math.sin(tNow * 10 + n.wig) * 0.08;
      // head sits on the note position, body trails behind toward the pipe
      const bx = x - Math.cos(ang) * L * 0.42, by = y - Math.sin(ang) * L * 0.42;
      if (n.partner && !n.judged && !n.partner.judged && n.lane < n.partner.lane) {
        g.strokeStyle = `rgba(74,223,202,${0.55 * alpha})`; g.lineWidth = 3;
        g.beginPath(); g.moveTo(x, y); g.lineTo(this.laneX(n.partner.lane, p), y); g.stroke();
      }
      // dark drop shadow on the grate + aqua rim glow so silver fish pop off the steel
      g.fillStyle = `rgba(0,0,0,${0.5 * alpha})`;
      g.beginPath(); g.ellipse(bx + L * 0.05, by + L * 0.07, L * 0.52, L * 0.17, ang, 0, TAU); g.fill();
      g.save(); g.shadowColor = 'rgba(74,223,202,.75)'; g.shadowBlur = Math.max(6, L * 0.2);
      drawFish(g, bx, by, L, ang, FISH_SALMON, Math.sin(tNow * 14 + n.wig), { alpha, flash: n.res === 'miss' ? 0.5 : 0 });
      g.restore();
    }

    // splash rings + particles
    for (const r of this.rings) {
      const q = r.t / 0.5;
      g.strokeStyle = r.col; g.globalAlpha = 1 - q; g.lineWidth = 3;
      g.beginPath(); g.ellipse(r.x, r.y, laneW * (0.2 + q * 0.5), padH * (0.3 + q * 0.6), 0, 0, TAU); g.stroke();
    }
    g.globalAlpha = 1;
    this.parts.render(g);

    // judgement popups
    g.textAlign = 'center'; g.textBaseline = 'middle';
    for (const pp of this.popups) {
      const q = pp.t / 0.7;
      g.globalAlpha = 1 - q;
      g.fillStyle = pp.res === 'perfect' ? C.aqua2 : pp.res === 'good' ? C.ice : C.danger;
      g.font = `800 ${Math.round(clamp(laneW * 0.17, 13, 24) * (1 + (1 - q) * 0.15))}px ${FONT_BODY}`;
      g.fillText(t('judge.' + pp.res), this.laneX(pp.lane, 1), hitY - padH - 14 - q * 34);
    }
    g.globalAlpha = 1;

    // combo counter in the middle of the flow
    if (this.combo >= 5 && !this.thumb) {
      const my = lerp(this.topY, hitY, 0.52);
      g.fillStyle = `rgba(224,247,255,${0.14 + this.comboPulse * 0.4})`;
      g.font = `700 ${Math.round(clamp(W * 0.12, 48, 110))}px ${FONT_MONO}`;
      g.fillText(String(this.combo), cx, my);
      g.font = `700 ${Math.round(clamp(W * 0.018, 11, 15))}px ${FONT_MONO}`;
      g.fillStyle = 'rgba(74,223,202,.6)';
      g.fillText(`${t('hud.combo').toUpperCase()} ×${this.mult().toFixed(1)}`, cx, my + clamp(W * 0.07, 32, 66));
    }

    // count-in
    if (!this.thumb && this.tempo && tNow < this.tempo.time(BEAT.LEAD_STEPS) + 0.4) {
      const lead = this.tempo.time(BEAT.LEAD_STEPS);
      let txt = t('beat.ready');
      if (tNow >= this.tempo.time(16)) {
        const beatsLeft = Math.ceil((lead - tNow) / (this.tempo.dur(16) * 4));
        txt = beatsLeft > 0 ? String(beatsLeft) : t('beat.go');
      }
      g.fillStyle = C.ice; g.font = `800 ${Math.round(clamp(W * 0.06, 28, 56))}px ${FONT_BODY}`;
      g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 12;
      g.fillText(txt, cx, lerp(this.topY, hitY, 0.36));
      g.shadowBlur = 0;
    }
    g.restore();

    // low-flow warning tint
    if (this.hp < 30 && !this.thumb) {
      const a = (1 - this.hp / 30) * (0.25 + 0.1 * Math.sin(tNow * 8));
      const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
      vg.addColorStop(0, 'rgba(255,68,68,0)'); vg.addColorStop(1, `rgba(255,68,68,${a})`);
      g.fillStyle = vg; g.fillRect(0, 0, W, H);
    }
  }

  /* ---------- static thumbnails / legend icons ---------- */
  static thumb(g, w, h) {
    const s = new BeatGame({}, { thumb: true });
    s.now = () => 1;
    s.resize(w, h);
    const mk = (lane, p, extra = {}) => ({ lane, spawn: 0, time: 1 / p, judged: false, wig: lane * 1.7 + p, ...extra });
    s.notes = [mk(0, 0.35), mk(1, 0.62), mk(2, 0.18), mk(3, 0.93), mk(2, 0.8)];
    s.pads = [0, 0, 0, 0.8];
    s.render(g);
  }
  static icon(g, w, h, key) {
    g.fillStyle = '#0b1215'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#1f3a45';
    for (let x = 2; x < w; x += 6) g.fillRect(x, 0, 2, h);
    g.fillStyle = 'rgba(5,24,32,.55)'; g.fillRect(0, 0, w, h);
    const fish = (x, y, L) => drawFish(g, x, y, L, Math.PI / 2, FISH_SALMON, 0.5);
    if (key === 'fish') { fish(w / 2, h * 0.42, h * 0.8); g.strokeStyle = C.aqua2; g.lineWidth = 2; g.beginPath(); g.moveTo(4, h * 0.82); g.lineTo(w - 4, h * 0.82); g.stroke(); }
    else if (key === 'pair') { g.strokeStyle = C.aqua2; g.lineWidth = 2; g.beginPath(); g.moveTo(w * 0.3, h * 0.72); g.lineTo(w * 0.7, h * 0.72); g.stroke(); fish(w * 0.3, h * 0.42, h * 0.7); fish(w * 0.7, h * 0.42, h * 0.7); }
    else if (key === 'timing') {
      const cols = [C.danger, C.ice, C.aqua2, C.ice, C.danger], ws = [0.14, 0.18, 0.2, 0.18, 0.14];
      let x = w * 0.08; cols.forEach((c, i) => { g.fillStyle = c; g.globalAlpha = i === 2 ? 1 : 0.7; g.fillRect(x, h * 0.35, w * ws[i] - 2, h * 0.3); x += w * ws[i]; });
      g.globalAlpha = 1;
    } else if (key === 'meter') {
      roundRect(g, w * 0.12, h * 0.38, w * 0.76, h * 0.24, 4); g.fillStyle = 'rgba(224,247,255,.15)'; g.fill();
      roundRect(g, w * 0.12, h * 0.38, w * 0.5, h * 0.24, 4); g.fillStyle = C.aqua; g.fill();
    } else if (key === 'speed') {
      g.strokeStyle = C.aqua2; g.lineWidth = 3; g.lineCap = 'round';
      for (let k = 0; k < 3; k++) { const y = h * (0.22 + k * 0.22); g.beginPath(); g.moveTo(w * 0.36, y); g.lineTo(w * 0.5, y + h * 0.14); g.lineTo(w * 0.64, y); g.stroke(); }
    }
  }
}

/* =====================================================================
   INPUT — key state map + edge events, virtual touch buttons
   ===================================================================== */
const Input = { keys: new Set(), virt: { up: false, down: false } };
const GAME_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space']);

/* =====================================================================
   SHELL — state machine: menu → select → howto → playing ⇄ paused → over
   ===================================================================== */
const $ = (s) => document.querySelector(s);
const canvas = $('#game'), g = canvas.getContext('2d');
const scene = new PenScene();
const menuSong = makeMenuSong();
const screens = ['scr-menu', 'scr-select', 'scr-howto', 'scr-settings', 'scr-pause', 'scr-over'].map((id) => document.getElementById(id));

const S = {
  state: 'menu', prev: 'menu', game: null, def: null, howtoId: GAMES[0].id,
  W: 0, H: 0, dpr: 1, acc: 0, last: performance.now(), hudEls: null, resetArmed: false, bannerTimer: 0,
};

function showScreen(id) { for (const s of screens) s.hidden = s.id !== id; }
function focusFirst(id) {
  const el = document.getElementById(id); if (!el || IS_TOUCH) return;
  const b = el.querySelector('.btn-primary, .btn, .tab'); if (b) b.focus({ preventScroll: true });
}
function ensureMenuMusic() { if (Audio.ready() && Audio.song !== menuSong) Audio.playSong(menuSong); }

function resize() {
  const r = document.getElementById('stage').getBoundingClientRect();
  S.W = Math.max(1, Math.round(r.width)); S.H = Math.max(1, Math.round(r.height));
  S.dpr = Math.min(window.devicePixelRatio || 1, CFG.DPR_CAP);
  canvas.width = Math.round(S.W * S.dpr); canvas.height = Math.round(S.H * S.dpr);
  g.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
  scene.resize(S.W, S.H);
  if (S.game) S.game.resize(S.W, S.H);
}

/* ---------- navigation ---------- */
function endCurrent() {
  if (S.game) S.game.destroy();
  S.game = null; S.hudEls = null;
  $('#hud').hidden = true; $('#touch-surv').hidden = true; $('#banner').hidden = true;
  Input.virt.up = Input.virt.down = false;
}
function goMenu() {
  endCurrent(); Audio.release(); S.state = 'menu'; showScreen('scr-menu'); ensureMenuMusic(); focusFirst('scr-menu');
}
function goSelect() {
  endCurrent(); Audio.release(); S.state = 'select'; renderSelect(); showScreen('scr-select'); ensureMenuMusic(); focusFirst('scr-select');
}
function goHowto(id, from) {
  S.prev = from || S.state; S.howtoId = id || S.howtoId; S.state = 'howto';
  renderHowto(); showScreen('scr-howto'); focusFirst('scr-howto');
}
function goSettings() {
  S.prev = S.state; S.state = 'settings'; S.resetArmed = false; $('#reset-note').textContent = '';
  syncSettings(); showScreen('scr-settings'); focusFirst('scr-settings');
}
function goBack() {
  if (S.state === 'howto' || S.state === 'settings') { S.prev === 'select' ? goSelect() : goMenu(); return; }
  if (S.state === 'select') goMenu();
}

function startGame(id) {
  Audio.init(); Audio.release();
  const def = GAMES.find((d) => d.id === id); if (!def) return;
  endCurrent();
  S.def = def; S.game = new def.cls(gameApi);
  S.game.resize(S.W, S.H);
  S.state = 'playing'; S.acc = 0; Input.keys.clear();
  showScreen(null);
  $('#hud').hidden = false; $('#hud-game').textContent = Lx(def.name);
  $('#touch-surv').hidden = !(IS_TOUCH && id === 'survival');
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  S.game.start();
}
function pauseGame() {
  if (S.state !== 'playing') return;
  S.state = 'paused'; Audio.hold(); if (S.game.pause) S.game.pause();
  $('#pause-game').textContent = Lx(S.def.name);
  showScreen('scr-pause'); focusFirst('scr-pause');
}
function resumeGame() {
  if (S.state !== 'paused') return;
  S.state = 'playing'; S.acc = 0; Input.keys.clear(); showScreen(null); Audio.release();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}

const gameApi = {
  banner(title, sub) { showBanner(title, sub); },
  endGame(res) {
    if (S.state !== 'playing' && S.state !== 'paused') return;
    S.state = 'over';
    const key = 'best:' + S.def.id, prevBest = Store.get(key, 0), isRecord = res.score > prevBest;
    if (isRecord) Store.set(key, res.score);
    $('#over-game').textContent = Lx(S.def.name);
    $('#over-reason').textContent = res.reason || '';
    $('#over-score').textContent = nf(res.score);
    $('#over-record').hidden = !isRecord || res.score <= 0;
    const dl = $('#over-stats'); dl.replaceChildren();
    const lines = [...res.lines, [t('select.best'), nf(Math.max(prevBest, res.score))]];
    for (const [k, v] of lines) { const dt = document.createElement('dt'); dt.textContent = k; const dd = document.createElement('dd'); dd.textContent = v; dl.append(dt, dd); }
    $('#touch-surv').hidden = true; $('#banner').hidden = true;
    showScreen('scr-over'); focusFirst('scr-over');
  },
};

function showBanner(title, sub) {
  const b = $('#banner'); b.replaceChildren();
  const h = document.createElement('strong'); h.textContent = title; b.append(h);
  if (sub) { const s = document.createElement('span'); s.textContent = sub; b.append(s); }
  b.hidden = false; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  clearTimeout(S.bannerTimer); S.bannerTimer = setTimeout(() => { b.hidden = true; }, 2200);
}

/* ---------- HUD (built once per game, values patched per frame) ---------- */
function updateHud() {
  const items = S.game.hud();
  const box = $('#hud-items');
  if (!S.hudEls) {
    box.replaceChildren(); S.hudEls = {};
    for (const it of items) {
      const d = document.createElement('div'); d.className = 'hud-item';
      const l = document.createElement('span'); l.className = 'hud-label'; l.textContent = it.label; d.append(l);
      if (it.meter != null) {
        const m = document.createElement('div'); m.className = 'hud-meter'; const i = document.createElement('i'); m.append(i); d.append(m);
        S.hudEls[it.k] = { meter: i, last: -1, col: '' };
      } else {
        const v = document.createElement('span'); v.className = 'hud-value'; d.append(v);
        S.hudEls[it.k] = { val: v, last: null };
      }
      box.append(d);
    }
  }
  for (const it of items) {
    const e = S.hudEls[it.k]; if (!e) continue;
    if (e.meter) {
      const w = Math.round(clamp(it.meter, 0, 1) * 100);
      if (w !== e.last) { e.meter.style.width = w + '%'; e.last = w; }
      if (it.color !== e.col) { e.meter.style.background = it.color; e.col = it.color; }
    } else if (it.value !== e.last) { e.val.textContent = it.value; e.last = it.value; }
  }
}

function button(label, cls, fn) {
  const b = document.createElement('button'); b.className = cls; b.type = 'button';
  const s = document.createElement('span'); s.textContent = label; b.append(s);
  b.addEventListener('click', () => { Audio.sfx.click(); fn(); });

}
function paintThumb(cv, def) {
  requestAnimationFrame(() => {
    const w = Math.max(160, Math.round(cv.clientWidth || 320)), h = Math.round(w * 9 / 16);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = w * dpr; cv.height = h * dpr;
    const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    try { def.cls.thumb(c, w, h); } catch (e) { console.error(e); }
  });
}

/* ---------- how-to screen ---------- */
function renderHowto() {

  const body = $('#howto-body'); body.replaceChildren();
  const left = document.createElement('section'); left.className = 'panel';
  const add = (parent, tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; parent.append(e); return e; };
  add(left, 'h3', null, t('howto.story'));
  add(left, 'p', 'story', Lx(def.story));
  add(left, 'h3', null, t('howto.goal'));
  add(left, 'p', null, Lx(def.goal));
  add(left, 'h3', null, t('howto.controls'));
  const dl = add(left, 'dl', 'keys');
  for (const [keys, label] of def.controls) {
    const dt = add(dl, 'dt');
    for (const k of keys) add(dt, 'kbd', null, typeof k === 'string' ? k : Lx(k));
    add(dl, 'dd', null, Lx(label));
  }
  add(left, 'h3', null, t('howto.touch'));
  add(left, 'p', null, Lx(def.touch));
  const right = document.createElement('section'); right.className = 'panel';
  add(right, 'h3', null, t('howto.legend'));
  const ul = add(right, 'ul', 'legend');
  for (const item of def.legend) {
    const li = add(ul, 'li');
    const cv = add(li, 'canvas'); cv.setAttribute('aria-hidden', 'true');
    const txt = add(li, 'div');
    add(txt, 'strong', null, Lx(item.name)); add(txt, 'span', null, Lx(item.desc));
    const dpr = Math.min(window.devicePixelRatio || 1, 2); cv.width = 72 * dpr; cv.height = 44 * dpr;
    const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    try { def.cls.icon(c, 72, 44, item.key); } catch (e) { console.error(e); }
  }
  body.append(left, right);
}

/* ---------- settings ---------- */
function syncSettings() {
  const st = Audio.settings;
  $('#set-music').value = Math.round(st.music * 100); $('#out-music').textContent = Math.round(st.music * 100) + '%';
  $('#set-sfx').value = Math.round(st.sfx * 100); $('#out-sfx').textContent = Math.round(st.sfx * 100) + '%';
  $('#set-offset').value = st.offsetMs; $('#out-offset').textContent = (st.offsetMs > 0 ? '+' : '') + st.offsetMs + ' ms';
}
function setLang(l) {
  LANG = l; Store.set('lang', l); document.documentElement.lang = l === 'no' ? 'nb' : 'en';
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  for (const b of document.querySelectorAll('[data-lang]')) b.setAttribute('aria-pressed', String(b.dataset.lang === l));
  if (S.state === 'select') renderSelect();
  if (S.state === 'howto') renderHowto();
  S.hudEls = null;
}

/* ---------- wiring ---------- */
function wire() {
  const on = (sel, fn) => $(sel).addEventListener('click', () => { Audio.init(); Audio.sfx.click(); fn(); });
  on('#m-play', goSelect);
  on('#m-howto', () => goHowto(S.howtoId, 'menu'));
  on('#m-settings', goSettings);
  on('#howto-play', () => startGame(S.howtoId));
  on('#p-resume', resumeGame);
  on('#p-restart', () => startGame(S.def.id));
  on('#p-quit', goMenu);
  on('#o-retry', () => startGame(S.def.id));
  on('#o-select', goSelect);
  on('#o-menu', goMenu);
  for (const b of document.querySelectorAll('[data-back]')) b.addEventListener('click', () => { Audio.sfx.click(); goBack(); });
  for (const b of document.querySelectorAll('[data-lang]')) b.addEventListener('click', () => { Audio.sfx.click(); setLang(b.dataset.lang); });
  $('#btn-pause').addEventListener('click', () => { pauseGame(); });
  $('#btn-mute').addEventListener('click', (e) => { const m = Audio.toggleMute(); e.currentTarget.setAttribute('aria-pressed', String(m)); e.currentTarget.blur(); });
  $('#btn-mute').setAttribute('aria-pressed', String(Audio.settings.muted));

  $('#set-music').addEventListener('input', (e) => { Audio.setMusic(e.target.value / 100); syncSettings(); });
  $('#set-sfx').addEventListener('input', (e) => { Audio.setSfx(e.target.value / 100); syncSettings(); });
  $('#set-sfx').addEventListener('change', () => Audio.sfx.bubble());
  $('#set-offset').addEventListener('input', (e) => { Audio.setOffset(Number(e.target.value)); syncSettings(); });
  $('#set-reset').addEventListener('click', () => {
    const note = $('#reset-note');
    if (!S.resetArmed) { S.resetArmed = true; note.textContent = t('settings.resetConfirm'); return; }
    for (const d of GAMES) Store.set('best:' + d.id, 0);
    S.resetArmed = false; note.textContent = t('settings.resetDone');
  });

  // Touch buttons for Dead Fish Survival (held state + jump edge).
  for (const b of document.querySelectorAll('#touch-surv button')) {
    const v = b.dataset.v;
    const down = (e) => {
      e.preventDefault(); b.classList.add('on');
      try { b.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      if (v === 'jump') { if (S.game && S.game.onVirtual) S.game.onVirtual('jump'); } else Input.virt[v] = true;
    };
    const up = () => { b.classList.remove('on'); if (v !== 'jump') Input.virt[v] = false; };
    b.addEventListener('pointerdown', down);
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
  }

  canvas.addEventListener('pointerdown', (e) => {
    Audio.init();
    if (S.state === 'playing' && S.game && S.game.onPointerDown) {
      e.preventDefault();
      const r = canvas.getBoundingClientRect();
      S.game.onPointerDown(e.clientX - r.left, e.clientY - r.top);
    }
  });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  // First interaction unlocks audio and starts the menu music.
  const unlock = () => { Audio.init(); if (['menu', 'select', 'howto', 'settings'].includes(S.state)) ensureMenuMusic(); };
  window.addEventListener('pointerdown', unlock, { capture: true });
  window.addEventListener('keydown', unlock, { capture: true });

  window.addEventListener('keydown', (e) => {
    const code = e.code;
    if (S.state === 'playing' || S.state === 'paused') { if (GAME_KEYS.has(code)) e.preventDefault(); }
    Input.keys.add(code);
    if (e.repeat) return;
    if (code === 'KeyM' && S.state !== 'settings') { const m = Audio.toggleMute(); $('#btn-mute').setAttribute('aria-pressed', String(m)); return; }
    switch (S.state) {
      case 'playing':
        if (code === 'Escape' || code === 'KeyP') { pauseGame(); return; }
        if (S.game.onKeyDown) S.game.onKeyDown(code);
        break;
      case 'paused':
        if (code === 'Escape' || code === 'KeyP') resumeGame();
        break;
      case 'over':
        if (code === 'Escape') goSelect();
        break;
      case 'select': case 'howto': case 'settings':
        if (code === 'Escape') goBack();
        break;
    }
  });
  window.addEventListener('keyup', (e) => Input.keys.delete(e.code));
  window.addEventListener('blur', () => { Input.keys.clear(); pauseGame(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { Input.keys.clear(); pauseGame(); } });
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(document.getElementById('stage'));
}

/* ---------- main loop: fixed-timestep update, render every frame ---------- */
function frame(now) {
  let dt = (now - S.last) / 1000; S.last = now;
  if (dt > CFG.MAX_FRAME) dt = CFG.MAX_FRAME;   // clamp after tab switches
  if (dt < 0) dt = 0;
  const inGame = S.game && (S.state === 'playing' || S.state === 'paused' || S.state === 'over');
  if (S.state === 'playing' && S.game) {
    S.acc += dt;
    while (S.acc >= CFG.FIXED_DT) {
      S.game.update(CFG.FIXED_DT); S.acc -= CFG.FIXED_DT;
      if (S.state !== 'playing') { S.acc = 0; break; }
    }
  } else if (S.state === 'over' && S.game) {
    // let particles settle behind the results panel
    S.game.parts && S.game.parts.update(dt);
  } else if (!inGame) {
    scene.update(dt);
  }
  g.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
  if (inGame) { S.game.render(g); if (S.game && S.state === 'playing') updateHud(); }
  else scene.render(g);
  requestAnimationFrame(frame);
}

function boot() {
  wire(); setLang(LANG); resize(); showScreen('scr-menu');
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (S.state === 'select') renderSelect(); });
  requestAnimationFrame((ts) => { S.last = ts; frame(ts); });
}
boot();
})();
</script>
